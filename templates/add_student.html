<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="student-container">

        <div class="student-box">

            <h1>🎓 Add Student</h1>

            <p class="subtitle">
                Enter the student's details
            </p>


            <form action="{{ url_for('add_student') }}"
                  method="POST">


                <!-- Roll Number -->

                <div class="input-group">

                    <label for="roll_no">
                        Roll Number
                    </label>

                    <input
                        type="text"
                        id="roll_no"
                        name="roll_no"
                        placeholder="Enter roll number"
                        required
                    >

                </div>


                <!-- Name -->

                <div class="input-group">

                    <label for="name">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter student name"
                        required
                    >

                </div>


                <!-- Department -->

                <div class="input-group">

                    <label for="department">
                        Department
                    </label>

                    <select
                        id="department"
                        name="department"
                        required
                    >

                        <option value="">
                            Select Department
                        </option>

                        <option value="Computer Science">
                            Computer Science
                        </option>

                        <option value="Information Technology">
                            Information Technology
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Mechanical">
                            Mechanical
                        </option>

                        <option value="Civil">
                            Civil
                        </option>

                    </select>

                </div>


                <!-- Semester -->

                <div class="input-group">

                    <label for="semester">
                        Semester
                    </label>

                    <select
                        id="semester"
                        name="semester"
                        required
                    >

                        <option value="">
                            Select Semester
                        </option>

                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>

                    </select>

                </div>


                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email"
                    >

                </div>


                <!-- Phone -->

                <div class="input-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                    >

                </div>


                <button type="submit">
                    Add Student
                </button>

            </form>


            <div class="back-link">

                <a href="{{ url_for('dashboard') }}">
                    ← Back to Dashboard
                </a>

            </div>

        </div>

    </div>

</body>

</html>
